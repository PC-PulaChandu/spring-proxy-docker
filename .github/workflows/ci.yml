name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# If you push again while a run is in progress, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [proxy-service, backend-service-1, backend-service-2]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports

  docker-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Create a throwaway environment file
        run: |
          cat > .env <<'EOF'
          MYSQL_DATABASE=proxydb
          MYSQL_USER=proxy
          MYSQL_PASSWORD=ci_user_password
          MYSQL_ROOT_PASSWORD=ci_root_password
          EOF

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait until the proxy answers
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/backend2/hello > /dev/null; then
              echo "Proxy is up"
              exit 0
            fi
            sleep 3
          done
          echo "Proxy did not start in time"
          exit 1

      - name: Smoke test through the proxy
        run: |
          set -e
          curl -fs http://localhost:8080/backend1/hello | grep "Hello from Backend Service 1"
          curl -fs http://localhost:8080/backend2/hello | grep "Hello from Backend Service 2"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/xyz)
          test "$code" = "404"
          curl -fs -X POST -H "Content-Type: text/plain" -d "hi" http://localhost:8080/backend1/echo | grep "hi"
          sleep 2
          curl -fs http://localhost:8080/internal/log-stats | grep '"failed":0'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v