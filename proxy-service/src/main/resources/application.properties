spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proxydb}
spring.datasource.username=${DB_USERNAME:proxy}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
proxy.selector=round-robin

proxy.routes[0].name=backend-service-1
proxy.routes[0].prefix=/backend1
proxy.routes[0].urls[0]=http://backend-service-1:8080
proxy.routes[0].urls[1]=http://backend-service-1b:8080

proxy.routes[1].name=backend-service-2
proxy.routes[1].prefix=/backend2
proxy.routes[1].urls[0]=http://backend-service-2:8080
proxy.logging.core-pool-size=2
proxy.logging.max-pool-size=4
proxy.logging.queue-capacity=1000

spring.datasource.hikari.connection-timeout=3000