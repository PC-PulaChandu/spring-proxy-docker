services:
  backend-service-1:
    build:
      context: ./backend-service-1
    container_name: backend-service-1
    restart: unless-stopped
    environment:
      INSTANCE_NAME: instance-a
    expose:
      - "8080"

  backend-service-1b:
    build:
      context: ./backend-service-1
    container_name: backend-service-1b
    restart: unless-stopped
    environment:
      INSTANCE_NAME: instance-b
    expose:
      - "8080"

  backend-service-2:
    build:
      context: ./backend-service-2
    container_name: backend-service-2
    restart: unless-stopped
    expose:
      - "8080"

  proxy-service:
    build:
      context: ./proxy-service
    container_name: proxy-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://${RDS_HOST:?RDS_HOST is not set}:3306/${RDS_DATABASE:?RDS_DATABASE is not set}?sslMode=REQUIRED
      DB_USERNAME: ${RDS_USER:?RDS_USER is not set}
      DB_PASSWORD: ${RDS_PASSWORD:?RDS_PASSWORD is not set}
    depends_on:
      backend-service-1:
        condition: service_started
      backend-service-1b:
        condition: service_started
      backend-service-2:
        condition: service_started